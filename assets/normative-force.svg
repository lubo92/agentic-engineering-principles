<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <marker id="arrGrey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a9adb4"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0e6e5c"/>
    </marker>
    <filter id="cardshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#1f2328" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="#faf9f6"/>

  <!-- header -->
  <text x="600" y="80" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif"
        font-size="22" letter-spacing="4" fill="#0e6e5c">THE NORMATIVE FORCE OF THE FACTUAL</text>
  <text x="600" y="150" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif"
        font-size="52" font-weight="bold" fill="#1f2328">Where the target state lives</text>
  <text x="600" y="196" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif"
        font-size="25" fill="#5b6067">What really defines what a solution is supposed to do?</text>

  <!-- ================= LEFT PANEL ================= -->
  <g filter="url(#cardshadow)">
    <rect x="70" y="240" width="500" height="700" rx="18" fill="#ffffff" stroke="#ddd9cf" stroke-width="2"/>
  </g>
  <text x="320" y="296" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif"
        font-size="21" font-weight="bold" letter-spacing="1.5" fill="#8a8f98">HUMANS WRITE AND REVIEW THE CODE</text>

  <!-- spec box (faded) -->
  <rect x="110" y="326" width="420" height="120" rx="12" fill="#f4f3ef" stroke="#ddd9cf" stroke-width="2"/>
  <text x="320" y="374" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="bold" fill="#9aa0a7">Journeys · Requirements</text>
  <text x="320" y="408" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="22" fill="#9aa0a7">Acceptance criteria</text>
  <text x="320" y="474" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-style="italic" fill="#a9adb4">written at the start — then outrun</text>

  <!-- drift arrow -->
  <line x1="320" y1="496" x2="320" y2="556" stroke="#a9adb4" stroke-width="4" stroke-dasharray="8 7" marker-end="url(#arrGrey)"/>
  <text x="320" y="588" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#8a8f98">the norm slides downward</text>

  <!-- code box (holds the norm) -->
  <rect x="110" y="610" width="420" height="120" rx="12" fill="#ffffff" stroke="#1f2328" stroke-width="3"/>
  <rect x="368" y="592" width="146" height="34" rx="17" fill="#1f2328"/>
  <text x="441" y="616" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="bold" letter-spacing="1.5" fill="#ffffff">NORMATIVE</text>
  <text x="320" y="686" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#1f2328">Code</text>
  <text x="320" y="762" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-style="italic" fill="#8a8f98">what counts is what the code says</text>

  <line x1="150" y1="812" x2="490" y2="812" stroke="#ece9e2" stroke-width="2"/>
  <text x="320" y="856" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="21" fill="#444a51">To learn what the system owes you,</text>
  <text x="320" y="886" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="21" fill="#444a51">you read the implementation.</text>

  <!-- ================= RIGHT PANEL ================= -->
  <g filter="url(#cardshadow)">
    <rect x="630" y="240" width="500" height="700" rx="18" fill="#ffffff" stroke="#ddd9cf" stroke-width="2"/>
  </g>
  <text x="880" y="296" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif"
        font-size="21" font-weight="bold" letter-spacing="1.5" fill="#0e6e5c">NO HUMAN READS THE CODE</text>

  <!-- spec box (holds the norm) -->
  <rect x="670" y="326" width="420" height="120" rx="12" fill="#eef5f3" stroke="#0e6e5c" stroke-width="3"/>
  <rect x="928" y="308" width="146" height="34" rx="17" fill="#0e6e5c"/>
  <text x="1001" y="332" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="16" font-weight="bold" letter-spacing="1.5" fill="#ffffff">NORMATIVE</text>
  <text x="880" y="382" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1f2328">Journeys · Requirements</text>
  <text x="880" y="416" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="22" fill="#444a51">Acceptance criteria</text>
  <text x="880" y="474" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-style="italic" fill="#0e6e5c">the only source of the target state</text>

  <!-- rebuild arrow -->
  <line x1="880" y1="496" x2="880" y2="556" stroke="#0e6e5c" stroke-width="4" marker-end="url(#arrGreen)"/>
  <text x="880" y="588" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="19" fill="#0e6e5c">agents rebuild against it</text>

  <!-- code box (disposable) -->
  <rect x="670" y="610" width="420" height="120" rx="12" fill="#ffffff" stroke="#c9ccd1" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="880" y="686" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="bold" fill="#8a8f98">Code</text>
  <text x="880" y="762" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="19" font-style="italic" fill="#8a8f98">a disposable artifact</text>

  <line x1="710" y1="812" x2="1050" y2="812" stroke="#ece9e2" stroke-width="2"/>
  <text x="880" y="856" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="21" fill="#444a51">New feature? Add a journey.</text>
  <text x="880" y="886" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="21" fill="#444a51">Unwanted behaviour? Add a criterion.</text>

  <!-- footer -->
  <text x="600" y="1020" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif"
        font-size="27" fill="#5b6067">Code is replaceable only once everything worth keeping</text>
  <text x="600" y="1058" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif"
        font-size="27" fill="#5b6067">is written down somewhere else.</text>
  <text x="600" y="1130" text-anchor="middle" font-family="Liberation Mono, monospace"
        font-size="22" fill="#8a8f98">github.com/lubo92/agentic-engineering-principles</text>
</svg>
