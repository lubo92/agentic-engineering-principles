<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <marker id="arrGrey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a9adb4"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0e6e5c"/>
    </marker>
    <filter id="cardshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#1f2328" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="#faf9f6"/>

  <!-- header: context first, then the question -->
  <text x="600" y="92" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif"
        font-size="25" letter-spacing="3.5" fill="#0e6e5c">AGENTS WRITE EVERY LINE · NO HUMAN READS THE CODE</text>
  <text x="600" y="178" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif"
        font-size="55" font-weight="bold" fill="#1f2328">So what defines what it should do?</text>

  <!-- ================= LEFT PANEL ================= -->
  <g filter="url(#cardshadow)">
    <rect x="70" y="248" width="500" height="680" rx="18" fill="#ffffff" stroke="#ddd9cf" stroke-width="2"/>
  </g>
  <text x="320" y="312" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif"
        font-size="27" font-weight="bold" letter-spacing="2.5" fill="#9aa0a7">TRADITIONAL</text>

  <rect x="110" y="348" width="420" height="132" rx="12" fill="#f4f3ef" stroke="#ddd9cf" stroke-width="2"/>
  <text x="320" y="400" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="bold" fill="#9aa0a7">Journeys · Requirements</text>
  <text x="320" y="438" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="24" fill="#9aa0a7">Acceptance criteria</text>

  <line x1="320" y1="512" x2="320" y2="578" stroke="#a9adb4" stroke-width="4" stroke-dasharray="8 7" marker-end="url(#arrGrey)"/>
  <text x="320" y="616" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="22" fill="#8a8f98">the norm drifts down</text>

  <rect x="110" y="644" width="420" height="132" rx="12" fill="#ffffff" stroke="#1f2328" stroke-width="3"/>
  <rect x="360" y="626" width="156" height="36" rx="18" fill="#1f2328"/>
  <text x="438" y="651" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="bold" letter-spacing="1.5" fill="#ffffff">NORMATIVE</text>
  <text x="320" y="727" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="34" font-weight="bold" fill="#1f2328">Code</text>

  <line x1="150" y1="828" x2="490" y2="828" stroke="#ece9e2" stroke-width="2"/>
  <text x="320" y="878" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="24" fill="#444a51">The truth is in the implementation.</text>

  <!-- ================= RIGHT PANEL ================= -->
  <g filter="url(#cardshadow)">
    <rect x="630" y="248" width="500" height="680" rx="18" fill="#ffffff" stroke="#ddd9cf" stroke-width="2"/>
  </g>
  <text x="880" y="312" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif"
        font-size="27" font-weight="bold" letter-spacing="2.5" fill="#0e6e5c">HANDS-OFF</text>

  <rect x="670" y="348" width="420" height="132" rx="12" fill="#eef5f3" stroke="#0e6e5c" stroke-width="3"/>
  <rect x="920" y="330" width="156" height="36" rx="18" fill="#0e6e5c"/>
  <text x="998" y="355" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="17" font-weight="bold" letter-spacing="1.5" fill="#ffffff">NORMATIVE</text>
  <text x="880" y="404" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="bold" fill="#1f2328">Journeys · Requirements</text>
  <text x="880" y="442" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="24" fill="#444a51">Acceptance criteria</text>

  <line x1="880" y1="512" x2="880" y2="578" stroke="#0e6e5c" stroke-width="4" marker-end="url(#arrGreen)"/>
  <text x="880" y="616" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="22" fill="#0e6e5c">agents rebuild against it</text>

  <rect x="670" y="644" width="420" height="132" rx="12" fill="#ffffff" stroke="#c9ccd1" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="880" y="727" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="34" font-weight="bold" fill="#8a8f98">Code</text>

  <line x1="710" y1="828" x2="1050" y2="828" stroke="#ece9e2" stroke-width="2"/>
  <text x="880" y="878" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="24" fill="#444a51">A disposable artifact.</text>

  <!-- closing line -->
  <line x1="560" y1="1000" x2="640" y2="1000" stroke="#0e6e5c" stroke-width="4"/>
  <text x="600" y="1076" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif"
        font-size="34" font-weight="bold" fill="#1f2328">New feature? Add a journey.</text>
  <text x="600" y="1126" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif"
        font-size="34" font-weight="bold" fill="#1f2328">Unwanted behaviour? Add a criterion.</text>
</svg>
