<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0e6e5c"/>
    </marker>
    <filter id="cardshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#1f2328" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="#faf9f6"/>

  <!-- kicker -->
  <text x="600" y="112" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif"
        font-size="24" letter-spacing="5" fill="#0e6e5c">AGENTIC ENGINEERING · A GOVERNANCE MODEL</text>

  <!-- headline -->
  <text x="600" y="200" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif"
        font-size="74" font-weight="bold" fill="#1f2328">No human reads the code.</text>

  <!-- subline -->
  <text x="600" y="256" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif"
        font-size="30" fill="#5b6067">Governance moves from reviewing diffs to ratifying what must hold.</text>

  <!-- ===== card 1 : top-left ===== -->
  <g filter="url(#cardshadow)">
    <rect x="105" y="330" width="430" height="230" rx="18" fill="#ffffff" stroke="#ddd9cf" stroke-width="2"/>
  </g>
  <circle cx="157" cy="386" r="17" fill="#0e6e5c"/>
  <text x="157" y="394" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">1</text>
  <text x="189" y="396" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1f2328">Humans ratify intent</text>
  <text x="141" y="448" font-family="Liberation Sans, Arial, sans-serif" font-size="26" fill="#444a51">Journeys, decisions, and a</text>
  <text x="141" y="484" font-family="Liberation Sans, Arial, sans-serif" font-size="26" fill="#444a51">constitution decide what</text>
  <text x="141" y="520" font-family="Liberation Sans, Arial, sans-serif" font-size="26" fill="#444a51">shall count.</text>

  <!-- ===== card 2 : top-right ===== -->
  <g filter="url(#cardshadow)">
    <rect x="665" y="330" width="430" height="230" rx="18" fill="#ffffff" stroke="#ddd9cf" stroke-width="2"/>
  </g>
  <circle cx="717" cy="386" r="17" fill="#0e6e5c"/>
  <text x="717" y="394" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">2</text>
  <text x="749" y="396" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1f2328">Agents build</text>
  <text x="701" y="448" font-family="Liberation Sans, Arial, sans-serif" font-size="26" fill="#444a51">Write, test, merge — no</text>
  <text x="701" y="484" font-family="Liberation Sans, Arial, sans-serif" font-size="26" fill="#444a51">human review. The code</text>
  <text x="701" y="520" font-family="Liberation Sans, Arial, sans-serif" font-size="26" fill="#444a51">is a disposable artifact.</text>

  <!-- ===== card 3 : bottom-right ===== -->
  <g filter="url(#cardshadow)">
    <rect x="665" y="650" width="430" height="230" rx="18" fill="#ffffff" stroke="#ddd9cf" stroke-width="2"/>
  </g>
  <circle cx="717" cy="706" r="17" fill="#0e6e5c"/>
  <text x="717" y="714" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">3</text>
  <text x="749" y="716" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1f2328">The harness verifies</text>
  <text x="701" y="768" font-family="Liberation Sans, Arial, sans-serif" font-size="26" fill="#444a51">Twin environments and</text>
  <text x="701" y="804" font-family="Liberation Sans, Arial, sans-serif" font-size="26" fill="#444a51">deterministic gates yield</text>
  <text x="701" y="840" font-family="Liberation Sans, Arial, sans-serif" font-size="26" fill="#444a51">evidence, not opinion.</text>

  <!-- ===== card 4 : bottom-left ===== -->
  <g filter="url(#cardshadow)">
    <rect x="105" y="650" width="430" height="230" rx="18" fill="#ffffff" stroke="#ddd9cf" stroke-width="2"/>
  </g>
  <circle cx="157" cy="706" r="17" fill="#0e6e5c"/>
  <text x="157" y="714" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff">4</text>
  <text x="189" y="716" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="bold" fill="#1f2328">The register remembers</text>
  <text x="141" y="768" font-family="Liberation Sans, Arial, sans-serif" font-size="26" fill="#444a51">Every finding gets a</text>
  <text x="141" y="804" font-family="Liberation Sans, Arial, sans-serif" font-size="26" fill="#444a51">recorded verdict — fixed</text>
  <text x="141" y="840" font-family="Liberation Sans, Arial, sans-serif" font-size="26" fill="#444a51">means pinned by a test.</text>

  <!-- arrows, clockwise -->
  <line x1="550" y1="445" x2="650" y2="445" stroke="#0e6e5c" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="880" y1="572" x2="880" y2="636" stroke="#0e6e5c" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="650" y1="765" x2="550" y2="765" stroke="#0e6e5c" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="320" y1="636" x2="320" y2="572" stroke="#0e6e5c" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- tagline -->
  <line x1="560" y1="962" x2="640" y2="962" stroke="#0e6e5c" stroke-width="4"/>
  <text x="600" y="1026" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif"
        font-size="44" font-weight="bold" fill="#1f2328">The direction stays human.</text>
  <text x="600" y="1082" text-anchor="middle" font-family="Liberation Mono, monospace"
        font-size="24" fill="#8a8f98">github.com/lubo92/agentic-engineering-principles</text>
</svg>
