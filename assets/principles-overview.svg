<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <filter id="cardshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#1f2328" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="#faf9f6"/>

  <!-- kicker -->
  <text x="600" y="92" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif"
        font-size="23" letter-spacing="5" fill="#0e6e5c">AGENTIC ENGINEERING · A GOVERNANCE MODEL</text>

  <!-- headline -->
  <text x="600" y="172" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif"
        font-size="64" font-weight="bold" fill="#1f2328">No human reads the code.</text>

  <!-- subline -->
  <text x="600" y="222" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif"
        font-size="28" fill="#5b6067">Sixteen principles in four domains keep the trunk sound anyway.</text>

  <!-- ===== panel: AUTHORITY (top-left) ===== -->
  <g filter="url(#cardshadow)">
    <rect x="70" y="278" width="515" height="320" rx="18" fill="#ffffff" stroke="#ddd9cf" stroke-width="2"/>
  </g>
  <text x="100" y="330" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="bold" letter-spacing="2" fill="#0e6e5c">AUTHORITY</text>
  <text x="100" y="362" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-style="italic" fill="#8a8f98">who writes what, and who judges</text>
  <text x="118" y="412" text-anchor="end" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="bold" fill="#0e6e5c">1</text>
  <text x="134" y="412" font-family="Liberation Sans, Arial, sans-serif" font-size="21" fill="#444a51">Humans own intent; agents own the technical</text>
  <text x="118" y="454" text-anchor="end" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="bold" fill="#0e6e5c">2</text>
  <text x="134" y="454" font-family="Liberation Sans, Arial, sans-serif" font-size="21" fill="#444a51">Layers protected in proportion to power</text>
  <text x="118" y="496" text-anchor="end" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="bold" fill="#0e6e5c">3</text>
  <text x="134" y="496" font-family="Liberation Sans, Arial, sans-serif" font-size="21" fill="#444a51">Agents review human text; tests review code</text>
  <text x="118" y="538" text-anchor="end" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="bold" fill="#0e6e5c">4</text>
  <text x="134" y="538" font-family="Liberation Sans, Arial, sans-serif" font-size="21" fill="#444a51">Implementer and verifier are never the same</text>

  <!-- ===== panel: VERIFICATION (top-right) ===== -->
  <g filter="url(#cardshadow)">
    <rect x="615" y="278" width="515" height="320" rx="18" fill="#ffffff" stroke="#ddd9cf" stroke-width="2"/>
  </g>
  <text x="645" y="330" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="bold" letter-spacing="2" fill="#0e6e5c">VERIFICATION</text>
  <text x="645" y="362" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-style="italic" fill="#8a8f98">two kinds of checks</text>
  <text x="663" y="412" text-anchor="end" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="bold" fill="#0e6e5c">5</text>
  <text x="679" y="412" font-family="Liberation Sans, Arial, sans-serif" font-size="21" fill="#444a51">Only deterministic checks can block a merge</text>
  <text x="663" y="454" text-anchor="end" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="bold" fill="#0e6e5c">6</text>
  <text x="679" y="454" font-family="Liberation Sans, Arial, sans-serif" font-size="21" fill="#444a51">Every criterion has a deterministic check</text>
  <text x="663" y="496" text-anchor="end" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="bold" fill="#0e6e5c">7</text>
  <text x="679" y="496" font-family="Liberation Sans, Arial, sans-serif" font-size="21" fill="#444a51">Behavior verdicts rest on observed behavior</text>

  <!-- ===== panel: FLOW (bottom-left) ===== -->
  <g filter="url(#cardshadow)">
    <rect x="70" y="628" width="515" height="320" rx="18" fill="#ffffff" stroke="#ddd9cf" stroke-width="2"/>
  </g>
  <text x="100" y="680" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="bold" letter-spacing="2" fill="#0e6e5c">FLOW</text>
  <text x="100" y="712" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-style="italic" fill="#8a8f98">from twin environments to production</text>
  <text x="127" y="762" text-anchor="end" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="bold" fill="#0e6e5c">8</text>
  <text x="143" y="762" font-family="Liberation Sans, Arial, sans-serif" font-size="21" fill="#444a51">Twin environments: base vs. head evidence</text>
  <text x="127" y="800" text-anchor="end" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="bold" fill="#0e6e5c">9</text>
  <text x="143" y="800" font-family="Liberation Sans, Arial, sans-serif" font-size="21" fill="#444a51">Own regressions block; old defects register</text>
  <text x="127" y="838" text-anchor="end" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="bold" fill="#0e6e5c">10</text>
  <text x="143" y="838" font-family="Liberation Sans, Arial, sans-serif" font-size="21" fill="#444a51">Closed only by a fix plus a regression test</text>
  <text x="127" y="876" text-anchor="end" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="bold" fill="#0e6e5c">11</text>
  <text x="143" y="876" font-family="Liberation Sans, Arial, sans-serif" font-size="21" fill="#444a51">One capped register is the single inbox</text>
  <text x="127" y="914" text-anchor="end" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="bold" fill="#0e6e5c">12</text>
  <text x="143" y="914" font-family="Liberation Sans, Arial, sans-serif" font-size="21" fill="#444a51">Merge judges relative; promotion absolute</text>

  <!-- ===== panel: LONGEVITY (bottom-right) ===== -->
  <g filter="url(#cardshadow)">
    <rect x="615" y="628" width="515" height="320" rx="18" fill="#ffffff" stroke="#ddd9cf" stroke-width="2"/>
  </g>
  <text x="645" y="680" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="bold" letter-spacing="2" fill="#0e6e5c">LONGEVITY</text>
  <text x="645" y="712" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-style="italic" fill="#8a8f98">the codebase and the harness itself</text>
  <text x="672" y="762" text-anchor="end" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="bold" fill="#0e6e5c">13</text>
  <text x="688" y="762" font-family="Liberation Sans, Arial, sans-serif" font-size="21" fill="#444a51">Unchecked things drift; ratchets hold</text>
  <text x="672" y="800" text-anchor="end" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="bold" fill="#0e6e5c">14</text>
  <text x="688" y="800" font-family="Liberation Sans, Arial, sans-serif" font-size="21" fill="#444a51">Every mechanism carries a removal condition</text>
  <text x="672" y="838" text-anchor="end" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="bold" fill="#0e6e5c">15</text>
  <text x="688" y="838" font-family="Liberation Sans, Arial, sans-serif" font-size="21" fill="#444a51">One durable record; transcripts don't count</text>
  <text x="672" y="876" text-anchor="end" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="bold" fill="#0e6e5c">16</text>
  <text x="688" y="876" font-family="Liberation Sans, Arial, sans-serif" font-size="21" fill="#444a51">Recurring work runs as written procedure</text>

  <!-- tagline -->
  <line x1="560" y1="1008" x2="640" y2="1008" stroke="#0e6e5c" stroke-width="4"/>
  <text x="600" y="1070" text-anchor="middle" font-family="Liberation Sans, Arial, sans-serif"
        font-size="42" font-weight="bold" fill="#1f2328">The direction stays human.</text>
  <text x="600" y="1122" text-anchor="middle" font-family="Liberation Mono, monospace"
        font-size="23" fill="#8a8f98">github.com/lubo92/agentic-engineering-principles</text>
</svg>
